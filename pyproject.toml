[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-ai-gateway-accelerator"
version = "0.1.0"
description = "Configuration-driven Unity AI Gateway governance accelerator"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.131,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
app = [
  "databricks-sql-connector>=3,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
aigw-accelerator = "aigw_accelerator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
