# Copy to config/customer.yml and replace placeholders.
# Never commit secrets, tokens, or customer-specific production identifiers.

account:
  id: "<ACCOUNT_ID>"
  host: "https://accounts.azuredatabricks.net"

# The automation resolves groups by display name and uses the account principal ID
# in budget overrides.
groups:
  - name: "aigw-budget-standard"
    description: "Standard Unity AI Gateway budget cohort"
    ensure: true
  - name: "aigw-budget-elevated"
    description: "Approved higher budget cohort"
    ensure: true
  - name: "aigw-model-users"
    description: "Users allowed to query the standard model service"
    ensure: true
  # Runaway tier groups must be Databricks-managed account groups (not external
  # IdP-managed groups). Each maps to an override on the role: runaway budget.
  - name: "aigw-runaway-limit-750"
    description: "Runaway tier: $750 month-to-date per-user cap"
    ensure: true
  - name: "aigw-runaway-limit-1000"
    description: "Runaway tier: $1,000 month-to-date per-user cap"
    ensure: true

daily_raise:
  # Self-raise policy for the role: runaway budget. Next tier >= month-to-date
  # spend + monthly cap / divisor, offered when less than the trigger remains.
  # When enabled, tiers must exactly match the runaway budget's overrides.
  enabled: false
  monthly_to_daily_divisor: 15
  raise_trigger_remaining_usd: 100
  tiers:
    - group: "aigw-runaway-limit-750"
      limit_usd: "750"
    - group: "aigw-runaway-limit-1000"
      limit_usd: "1000"

budgets:
  - id: "<EXISTING_BUDGET_ID>"
    role: "monthly"
    display_name: "<BUDGET_DISPLAY_NAME>"
    resource_type: "BUDGET_RESOURCE_TYPE_UNITY_AI_GATEWAY"
    workspace_ids: [<WORKSPACE_ID>]
    tags:
      team: ["engineering"]
      environment: ["production"]
    # The standard Account Budget API currently models MONTH thresholds.
    shared_thresholds:
      - amount_usd: "10000"
        email_recipients: ["ai-platform@example.com"]
        block: false
      - amount_usd: "15000"
        email_recipients: ["ai-platform@example.com", "finops@example.com"]
        block: true
    per_user_threshold:
      amount_usd: "500"
      email_recipients: ["ai-platform@example.com"]
      block: true
    overrides:
      - group: "aigw-budget-elevated"
        amount_usd: "1500"

  # Runaway budget: a second MONTH budget over the same scope. Omit id to create
  # it on apply, then pin the returned id here.
  - display_name: "<RUNAWAY_BUDGET_DISPLAY_NAME>"
    role: "runaway"
    resource_type: "BUDGET_RESOURCE_TYPE_UNITY_AI_GATEWAY"
    workspace_ids: [<WORKSPACE_ID>]
    tags:
      team: ["engineering"]
      environment: ["production"]
    per_user_threshold:
      amount_usd: "500"
      email_recipients: ["ai-platform@example.com"]
      block: true
    overrides:
      - group: "aigw-runaway-limit-750"
        amount_usd: "750"
      - group: "aigw-runaway-limit-1000"
        amount_usd: "1000"

# Model Services are workspace API resources backed by Unity Catalog.
# payload is sent to the documented model-services API after plan validation.
model_services:
  - workspace_host: "https://adb-<workspace-id>.<region>.azuredatabricks.net"
    workspace_id: <WORKSPACE_ID>
    catalog: "<GOVERNED_CATALOG>"
    schema: "ai"
    name: "standard-models"
    ensure: true
    allow_service_config_replacement: false
    endpoint_tags:
      team: "engineering"
      cost_center: "<COST_CENTER>"
      cost_tier: "standard"
    payload:
      comment: "Standard governed model service"
      config:
        routing:
          destinations:
            - name: "primary"
              destination_type: "DESTINATION_TYPE_PAY_PER_TOKEN_FOUNDATION_MODEL"
              traffic_percentage: 100
              pay_per_token_config:
                model: "models/system.ai.<FOUNDATION_MODEL>"
        # Payload logging. parent/table_name_prefix are immutable once created.
        inference_table:
          parent: "schemas/<GOVERNED_CATALOG>.ai"
          table_name_prefix: "standard_models"
        rate_limits:
          - key: "RATE_LIMIT_KEY_SERVICE"
            renewal_period: "RATE_LIMIT_RENEWAL_PERIOD_MINUTE"
            requests: "300"

# Model service access is managed through Unity Catalog grants.
# This accelerator plans grants and applies only explicitly declared grants.
grants:
  - workspace_host: "https://adb-<workspace-id>.<region>.azuredatabricks.net"
    workspace_id: <WORKSPACE_ID>
    securable_type: "model_service"
    full_name: "<GOVERNED_CATALOG>.ai.standard-models"
    grants:
      - principal: "aigw-model-users"
        privileges: ["EXECUTE"]
      - principal: "aigw-platform-admins"
        privileges: ["MANAGE"]

# Optional external provider service. Keep provider credentials out of Git;
# use the supported connection/secret reference fields for the target API.
# Inline `plaintext` credentials are rejected by validation; use a Unity Catalog
# service credential (Azure) or `secret_reference`. Azure prerequisites are in
# docs/microsoft-foundry.md.
model_provider_services:
  # Microsoft Foundry with a UC service credential (no stored secret).
  # - workspace_host: "https://adb-<workspace-id>.<region>.azuredatabricks.net"
  #   workspace_id: <WORKSPACE_ID>
  #   catalog: "<GOVERNED_CATALOG>"
  #   schema: "ai"
  #   name: "foundry_prod"
  #   # Changing targets on an existing provider requires this opt-in;
  #   # plan shows only the fields that differ.
  #   allow_service_config_replacement: false
  #   payload:
  #     config:
  #       provider_type: "EXTERNAL_MODEL_PROVIDER_TYPE_MICROSOFT_FOUNDRY"
  #       microsoft_foundry:
  #         direct:
  #           base_url: "https://<foundry-resource>.services.ai.azure.com/"
  #           service_credential:
  #             name: "credentials/<SERVICE_CREDENTIAL>"
  #       allow_all_targets: false
  #       targets:
  #         # Reasoning models (gpt-5.x / gpt-6.x / o-series) reject function
  #         # tools with reasoning_effort on chat/completions: include responses.
  #         - model: "<DEPLOYMENT_NAME>"
  #           native_api_types: ["openai/v1/chat/completions", "openai/v1/responses"]
  #
  # A model service routing to that provider:
  # model_services entry payload.config.routing.destinations:
  #   - name: "foundry-primary"
  #     destination_type: "DESTINATION_TYPE_EXTERNAL_FOUNDATION_MODEL"
  #     external_model_config:
  #       model_provider_service: "model-provider-services/<GOVERNED_CATALOG>.ai.foundry_prod"
  #       target:
  #         model: "<DEPLOYMENT_NAME>"
  #         native_api_types: ["openai/v1/chat/completions", "openai/v1/responses"]

# Governed tags are account-level definitions. Assignment to Model Services is
# capability-gated; ordinary endpoint_tags above remain the supported baseline.
governed_tags:
  # Definitions and assignments are intentionally not applied by the baseline.
  # Complete them only after verifying the target account supports model_service
  # governed-tag assignments and the corresponding API/SDK surface.
  - key: "cost_tier"
    description: "Approved service cost tier"
    allowed_values: ["standard", "elevated", "exception"]
    ensure: false

# Daily/runaway controls are deliberately disabled until the target account has
# a supported capability/API. Use service rate limits for burst protection first.
runaway_budget:
  enabled: false
  mode: "capability-gated"
